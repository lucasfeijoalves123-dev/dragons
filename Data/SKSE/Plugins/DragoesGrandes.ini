; DragoesGrandes - configuracao
[General]
; 1.15 = 15% maior. Vale para toda raca com a keyword ActorTypeDragon
ScaleMultiplier=1.15
EnableGlow=true

[Glow]
; intensidade do brilho (0.0 a 1.0). Comece baixo.
Alpha=0.35
; quanto maior, mais o brilho fica so na borda do corpo
EdgeFalloff=1.5

; Cor em R,G,B. Names = trechos do nome do dragao (sem diferenciar maiuscula),
; separados por virgula. O que nao bater com nenhum elemento usa [Fire].
[Frost]
Color=90,190,255
Names=frost,gelo,glacial,ice

[Shock]
Color=150,110,255
Names=shock,storm,eletr,tempest,raio,thunder

[Fire]
Color=255,110,20
Names=
